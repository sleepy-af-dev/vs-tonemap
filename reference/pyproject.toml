description = "float64 reference implementation and test harness for vs-tonemap"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2",
    "pytest>=8",
    "vapoursynth>=79",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "basedpyright>=1.40.1",
    "ruff>=0.16.7",
]
