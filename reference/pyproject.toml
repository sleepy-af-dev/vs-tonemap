[project]
name = "vstonemapper-reference"
version = "0.0.0"
description = "float64 reference implementation and test harness for vs-tonemapper"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2",
    "pytest>=8",
    "vapoursynth>=79",
]

[tool.uv]
package = false

[tool.ruff]
# ruff's own default, stated so that a checkout formats the same way
# everywhere. bench/ has no config of its own and takes the same value.
line-length = 88
# The oracle modules sit here and the harness sits in tests/, so both are
# first-party and their imports group together rather than among the
# installed packages.
src = [".", "tests"]

[tool.ruff.lint]
# ruff's documented defaults plus import sorting, stated so the rule set
# does not move with the ruff version. Line length is the formatter's job.
select = ["E4", "E7", "E9", "F", "I"]
