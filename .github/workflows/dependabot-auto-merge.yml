name: Dependabot auto-merge

# Auto-merge the low-risk Dependabot PRs: patch bumps in any ecosystem, and minor bumps
# to GitHub Actions, which are pinned by SHA here and so raise a PR for every release.
# Major bumps go to review whatever the ecosystem. Auto-merge only completes once the
# required checks pass, so CI remains the gate.

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      - name: Enable auto-merge
        # update-type is the highest semver change in the PR, so a grouped update
        # carrying one major is treated as a major and stops here.
        if: >
          steps.meta.outputs.update-type == 'version-update:semver-patch' ||
          (startsWith(github.head_ref, 'dependabot/github_actions/') &&
          steps.meta.outputs.update-type == 'version-update:semver-minor')
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ github.token }}
